name: banner-fingerprint

services:
  server:
    image: banner-fingerprint-server:1.0.0
    build:
      context: .
      target: server
    command: ["-listen", ":8080", "-rules", "/etc/bannerfp/rules"]
    ports:
      - "${SERVER_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - ./rules:/etc/bannerfp/rules:ro
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: 1.0
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      # scratch has no shell, so the healthcheck must use exec form.
      test: ["CMD", "/server", "healthcheck", "-url", "http://127.0.0.1:8080/health", "-timeout", "2s"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  client:
    image: banner-fingerprint-client:1.0.0
    build:
      context: .
      target: client
    depends_on:
      server:
        condition: service_healthy
    command: ["-input", "/data/input.json", "-server", "http://server:8080", "-format", "json"]
    volumes:
      - ./examples/input.json:/data/input.json:ro
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.5
    # The client is a one-shot job; restarting it would loop forever.
    restart: "no"
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    driver: bridge
